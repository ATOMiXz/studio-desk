/* ================= Render & events ================= */
function render() {
  const v = view();
  const fn = { desk: renderDesk, board: renderBoard, calendar: renderCalendar, news: renderNews, ideas: renderIdeas, team: renderTeam }[v] || renderDesk;
  $('#main').innerHTML = fn();
  document.querySelectorAll('.nav a').forEach(a => a.dataset.view === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const u = me();
  $('#navTaskCount').textContent = S.tasks.filter(t => t.assignee === u.id && t.status !== 'done').length || '';
  $('#navNewsCount').textContent = S.posts.filter(p => !p.acks.includes(u.id)).length || '';
  $('#sideAv').outerHTML = av(u.id).replace('class="av ', 'id="sideAv" class="av ');  document.title = `Studio Desk · ${u.name}`;
  if (v === 'board') bindBoard();
  if (v === 'desk') {
    shapeHero();
    watchWeather();
    startCatVideo();
    if (playIntro) { catIdx = 0; catShown = null; startIntro(); }
    else paintSays(false);
  }
  icons();
}

function applyTheme() {
  if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme;
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('#themeBtn').innerHTML = `<i data-lucide="${dark ? 'sun' : 'moon'}"></i>`;
  icons();
}

function bindBoard() {
  let dragId = null;
  document.querySelectorAll('[data-card]').forEach(c => {
    c.addEventListener('dragstart', e => { dragId = c.dataset.card; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
  document.querySelectorAll('[data-col]').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      const t = S.tasks.find(x => x.id === dragId); if (!t || t.status === col.dataset.col) return;
      if (col.dataset.col === 'done') markJustDone(t.id);
      setStatus(t, col.dataset.col);
      toast(`ย้าย “${t.title}” ไปที่ ${STATUSES.find(s => s.id === t.status).label}`);
    });
  });
}
// The card that just reached "done" gets its stamp animated on the next render only.
function markJustDone(id) { justDone = id; setTimeout(() => { if (justDone === id) justDone = null; }, 1200); }
function setStatus(t, st) { t.status = st; t.doneAt = st === 'done' ? key(TODAY) : null; save(); withVT(render); }

/* drawer */
let editing = null;
const form = $('#taskForm');
form.type.innerHTML = TYPES.map(t => `<option value="${t.id}">${t.label}</option>`).join('');
form.status.innerHTML = STATUSES.map(s => `<option value="${s.id}">${s.label}</option>`).join('');
form.assignee.innerHTML = MEMBERS.map(m => `<option value="${m.id}">${esc(m.name)} · ${esc(m.role)}</option>`).join('');
function openDrawer(t) {
  editing = t ? t.id : null;
  $('#drawerTitle').textContent = t ? 'รายละเอียดงาน' : 'งานใหม่';
  form.reset();
  const v = t || { title: '', client: '', type: 'social', status: 'todo', assignee: S.user, due: key(addDays(TODAY, 3)), note: '', img: '', urgent: false };
  ['title', 'client', 'type', 'status', 'assignee', 'due', 'note', 'img'].forEach(k => form[k].value = v[k] || '');
  form.urgent.checked = v.urgent;
  $('#delTask').hidden = !t;
  $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on');
  setTimeout(() => form.title.focus(), 50);
}
function closeDrawer() { $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); if (!$('#side').classList.contains('open')) $('#scrim').classList.remove('on'); }
form.addEventListener('submit', e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(form)); v.urgent = form.urgent.checked;
  if (editing) { const t = S.tasks.find(x => x.id === editing); const wasDone = t.status === 'done'; Object.assign(t, v); if (!wasDone && t.status === 'done') t.doneAt = key(TODAY); if (t.status !== 'done') t.doneAt = null; toast('บันทึกการแก้ไขแล้ว'); }
  else { S.tasks.push({ id: 't' + Date.now(), ...v, doneAt: v.status === 'done' ? key(TODAY) : null }); toast(`เพิ่มงานให้${M(v.assignee).id === S.user ? 'คุณ' : M(v.assignee).name}แล้ว`); }
  save(); closeDrawer(); render();
});
$('#delTask').addEventListener('click', () => { S.tasks = S.tasks.filter(t => t.id !== editing); save(); closeDrawer(); render(); toast('ลบงานแล้ว'); });

document.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#"]');
  if (link) { e.preventDefault(); if (link.dataset.as) { S.user = link.dataset.as; S.boardFilter = null; save(); $('#userSelect').value = S.user; } go(link.getAttribute('href').slice(1)); return; }
  if (e.target.closest('.cat-hit')) { catTalk(); return; }
  if (e.target.closest('.wx-flip')) { wxHourly = !wxHourly; render(); document.querySelector('.wx-flip')?.focus(); return; }
  const mv = e.target.closest('[data-move]');
  if (mv) {
    const t = S.tasks.find(x => x.id === mv.dataset.move), i = STATUSES.findIndex(s => s.id === t.status);
    if (STATUSES[i + 1].id === 'done') markJustDone(t.id);
    setStatus(t, STATUSES[i + 1].id);
    toast(`ย้าย “${t.title}” ไปที่ ${STATUSES[i + 1].label}`);
    return;
  }
  const el = e.target.closest('[data-new],[data-card],[data-close],[data-done],[data-m],[data-day],[data-ack],[data-tab],[data-tag],[data-spark],[data-sort],[data-as]');
  if (!el) return;
  const d = el.dataset;
  if ('new' in d) openDrawer(null);
  else if (d.card) openDrawer(S.tasks.find(t => t.id === d.card));
  else if ('close' in d) closeDrawer();
  else if (d.done) {
    const t = S.tasks.find(x => x.id === d.done), finishing = t.status !== 'done';
    if (!finishing) { setStatus(t, 'doing'); return; }
    // Show the tick and strike-through first, then let the row leave the list.
    el.classList.add('ticking'); el.disabled = true; el.closest('li').classList.add('leaving');
    const clearsAll = S.tasks.filter(x => x.assignee === S.user && x.status !== 'done').length === 1;
    setTimeout(() => {
      if (clearsAll) forcePose = 'done';
      setStatus(t, 'done');
      if (clearsAll) setTimeout(() => { celebrate(); forcePose = null; }, 450);
      else toast('เยี่ยม ปิดงานไปอีกหนึ่งชิ้น');
    }, reducedMotion() ? 0 : 320);
  }
  else if (d.m) { calMonth = d.m === '0' ? new Date(TODAY.getFullYear(), TODAY.getMonth(), 1) : new Date(calMonth.getFullYear(), calMonth.getMonth() + Number(d.m), 1); if (d.m === '0') S.calSel = key(TODAY); render(); }
  else if (d.day) { S.calSel = d.day; const dd = parse(d.day); if (dd.getMonth() !== calMonth.getMonth()) calMonth = new Date(dd.getFullYear(), dd.getMonth(), 1); save(); render(); }
  else if (d.ack) { const p = S.posts.find(x => x.id === d.ack); p.acks = p.acks.includes(S.user) ? p.acks.filter(i => i !== S.user) : [...p.acks, S.user]; save(); render(); }
  else if (d.tab) { S.ideaTab = d.tab; save(); render(); }
  else if (d.tag) { S.refTag = d.tag; save(); render(); }
  else if ('spark' in d) { S.sparkIdx = (S.sparkIdx + 1) % SPARKS.length; save(); render(); }
  else if (d.sort) { S.teamSort = d.sort; save(); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); }
  if (e.key === 'Enter' && e.target.matches('[data-card]')) openDrawer(S.tasks.find(t => t.id === e.target.dataset.card));
});
document.addEventListener('change', e => {
  if (e.target.id === 'boardFilter') { S.boardFilter = e.target.value; save(); render(); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'evForm') {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
    S.events.push({ date: S.calSel || key(TODAY), start: v.start, end: '', title: v.title, where: v.where, kind: 'meeting', who: v.who === 'all' ? 'all' : S.user });
    save(); render(); toast('เพิ่มนัดหมายแล้ว');
  } else if (e.target.id === 'postForm') {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
    S.posts.unshift({ id: 'p' + Date.now(), author: S.user, pinned: !!v.pinned, ago: 'เมื่อสักครู่', title: v.title, body: v.body || '', acks: [] });
    save(); render(); toast('ประกาศถึงทุกคนแล้ว');
  } else if (e.target.id === 'refForm') {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
    S.refs.unshift({ id: 'r' + Date.now(), src: v.src, tag: v.tag, note: v.note || 'ไม่มีโน้ต', by: S.user });
    S.refTag = 'ทั้งหมด'; save(); render(); toast('เพิ่มภาพเรฟเข้าคลังแล้ว');
  }
});

const us = $('#userSelect');
us.innerHTML = MEMBERS.map(m => `<option value="${m.id}">${esc(m.name)} · ${esc(m.role)}</option>`).join('');
us.value = S.user;
us.addEventListener('change', () => { S.user = us.value; S.boardFilter = null; save(); playIntro = true; render(); toast(`สลับเป็นหน้าของ${me().name}`); });
$('#themeBtn').addEventListener('click', () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; save(); applyTheme();
});
$('#menuBtn').addEventListener('click', () => { $('#side').classList.add('open'); $('#scrim').classList.add('on'); });
$('#scrim').addEventListener('click', () => { closeDrawer(); $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); });
$('#side').addEventListener('click', e => { if (e.target.closest('a')) { $('#side').classList.remove('open'); if (!$('#drawer').classList.contains('open')) $('#scrim').classList.remove('on'); } });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1) || 'desk'; if (v !== curView) go(v); });

applyTheme();
render();
loadWeather();
</script>
</body>
</html>

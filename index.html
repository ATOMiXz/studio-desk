<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  --canvas: #dcdcd7;
  --paper: #ffffff;
  --tile: #f3f3ef;
  --ink: #121212;
  --ink-2: #46474c;
  --ink-3: #66676d;
  --line: #e7e7e2;
  --line-strong: #cfcfc9;
  --violet: #6a3df0;
  --violet-ink: #ffffff;
  --lime: #d6f26a;
  --lime-ink: #1a2300;
  --yellow: #ffe26a;
  --yellow-ink: #2b2300;
  --green: #2b9a56;
  --dark: #141414;
  --dark-ink: #f4f4f2;
  --dark-2: #a6a6a2;
  --btn: #121212;
  --btn-ink: #ffffff;
  --accent: #6a3df0;
  --accent-hover: #5428d6;
  --accent-ink: #ffffff;
  --accent-soft: #efe9ff;
  --warn: #a8510a;
  --warn-soft: #fff0d4;
  --danger: #c9302a;
  --danger-soft: #ffe4e1;
  --ok: #1f8a4c;
  --surface: var(--paper);
  --panel: var(--tile);
  --bg: var(--paper);
  --shadow: 0 1px 2px rgba(18,18,18,.05), 0 8px 24px -12px rgba(18,18,18,.18);
  --shadow-lift: 0 2px 6px rgba(18,18,18,.08), 0 22px 40px -18px rgba(18,18,18,.35);
  --r-xl: 30px;
  --r-lg: 24px;
  --radius: 14px;
  --font: "Anuphan", system-ui, sans-serif;
  --display: "Prompt", "Anuphan", system-ui, sans-serif;
  --serif: var(--display);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #050506; --paper: #111113; --tile: #1c1c1f;
    --ink: #f3f3f1; --ink-2: #c4c4c8; --ink-3: #9c9ca3;
    --line: #27272b; --line-strong: #3a3a40;
    --violet: #7447f5; --lime: #c8e85a; --yellow: #f1d356;
    --dark: #000000; --dark-ink: #f4f4f2; --dark-2: #a6a6a2;
    --btn: #f3f3f1; --btn-ink: #111113;
    --accent: #b8a2ff; --accent-hover: #cbbaff; --accent-ink: #170a35; --accent-soft: #251b42;
    --warn: #f0a560; --warn-soft: #33240f; --danger: #ff8a80; --danger-soft: #3b1b19; --ok: #7fd3a0;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.6), 0 22px 40px -18px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #050506; --paper: #111113; --tile: #1c1c1f;
  --ink: #f3f3f1; --ink-2: #c4c4c8; --ink-3: #9c9ca3;
  --line: #27272b; --line-strong: #3a3a40;
  --violet: #7447f5; --lime: #c8e85a; --yellow: #f1d356;
  --dark: #000000; --dark-ink: #f4f4f2; --dark-2: #a6a6a2;
  --btn: #f3f3f1; --btn-ink: #111113;
  --accent: #b8a2ff; --accent-hover: #cbbaff; --accent-ink: #170a35; --accent-soft: #251b42;
  --warn: #f0a560; --warn-soft: #33240f; --danger: #ff8a80; --danger-soft: #3b1b19; --ok: #7fd3a0;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lift: 0 2px 6px rgba(0,0,0,.6), 0 22px 40px -18px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--canvas); color: var(--ink); font: 400 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
::selection { background: var(--lime); color: var(--lime-ink); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; border-radius: 10px; }
a { color: inherit; text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
svg.lucide { width: 18px; height: 18px; stroke-width: 1.9; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.hl { background: linear-gradient(transparent 52%, var(--yellow) 52%, var(--yellow) 92%, transparent 92%); padding: 0 .12em; color: inherit; }

/* ---------- Shell: one rounded sheet with a top nav ---------- */
.app { min-height: calc(100vh - 28px); margin: 14px; background: var(--paper); border-radius: var(--r-xl); box-shadow: var(--shadow); }
.topnav { display: flex; align-items: center; gap: 20px; padding: 16px 22px 16px 28px; position: sticky; top: 0; z-index: 30; background: var(--paper); border-radius: var(--r-xl) var(--r-xl) 0 0; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
.brand::before { content: ""; width: 30px; height: 18px; flex: none; background: var(--violet); clip-path: polygon(0 0, 50% 38%, 100% 0, 100% 100%, 50% 62%, 0 100%); }
.brand b { font: 600 19px/1 var(--display); letter-spacing: -.01em; }
.nav { display: flex; gap: 2px; margin: 0 auto; }
.nav a { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 15px; transition: background .18s ease-out, color .18s ease-out; }
.nav a svg { display: none; }
.nav a:hover { color: var(--ink); background: var(--tile); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--tile); }
.nav .count { font-size: 11px; font-weight: 600; min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 999px; background: var(--violet); color: #fff; font-variant-numeric: tabular-nums; }
.nav .count:empty { display: none; }
.topnav-end { display: flex; align-items: center; gap: 8px; flex: none; }
.who { display: flex; align-items: center; gap: 6px; background: var(--btn); color: var(--btn-ink); border-radius: 999px; padding: 4px 6px 4px 4px; max-width: 220px; }
.who .av { width: 30px; height: 30px; }
.who select { flex: 1 1 0; width: 130px; min-width: 0; text-overflow: ellipsis; border: 0; background: transparent; color: inherit; padding: 4px 2px; font-size: 14px; font-weight: 500; cursor: pointer; }
.who select option { color: #121212; background: #fff; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--tile); cursor: pointer; color: var(--ink); transition: background .15s, transform .15s; }
.icon-btn:hover { background: var(--lime); color: var(--lime-ink); }
.icon-btn:active { transform: scale(.94); }
.menu-btn { display: none; }

main { min-width: 0; padding: 4px 14px 40px; }
.page { max-width: 1400px; margin: 0 auto; }
.page:not(:has(.bento)) { padding: 20px 0 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.page-head h1 { font: 500 44px/1.15 var(--display); margin: 0; letter-spacing: -.015em; text-wrap: balance; }
.page-head p { margin: 8px 0 0; color: var(--ink-2); max-width: 60ch; font-size: 16px; text-wrap: pretty; }
h2 { font: 600 18px/1.4 var(--display); margin: 0 0 16px; }
h3 { font: 600 15px/1.4 var(--display); margin: 0; }
.muted { color: var(--ink-3); }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--tile); color: var(--ink); font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, color .15s, transform .15s; }
.btn:hover { background: var(--line-strong); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--btn); color: var(--btn-ink); }
.btn.primary:hover { background: var(--violet); color: #fff; }
.btn.light { background: #fff; color: #121212; }
.btn.light:hover { background: var(--lime); color: var(--lime-ink); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--tile); color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn.sm { height: 34px; padding: 0 14px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; padding: 4px; background: var(--tile); border-radius: 999px; }
.seg button { border: 0; background: transparent; padding: 8px 18px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: 14px; transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.input, .field input, .field select, .field textarea, select.input { width: 100%; border: 0; background: var(--tile); border-radius: 14px; padding: 11px 16px; font-size: 15px; color: var(--ink); font-weight: 400; box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .15s, background .15s; }
select.input { border-radius: 999px; }
.input:focus, .field :is(input, select, textarea):focus { outline: none; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); }
::placeholder { color: var(--ink-3); opacity: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ink-2); padding: 3px 10px; border-radius: 999px; background: var(--tile); white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--ink-3)); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.ok { background: var(--lime); color: var(--lime-ink); }
.av { --h: 160; display: inline-grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 50%; background: hsl(var(--h) 70% 86%); color: hsl(var(--h) 55% 20%); font: 600 12px/1 var(--display); }
:root[data-theme="dark"] .av { background: hsl(var(--h) 35% 28%); color: hsl(var(--h) 60% 88%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .av { background: hsl(var(--h) 35% 28%); color: hsl(var(--h) 60% 88%); } }
.av.lg { width: 42px; height: 42px; font-size: 16px; }
.empty { color: var(--ink-3); font-size: 14px; padding: 12px 0; }
.skeleton { background: linear-gradient(90deg, var(--tile), var(--line), var(--tile)); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; border-radius: 8px; color: transparent !important; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- Desk: Cognix-style hero + bento ---------- */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.tile { border-radius: var(--r-lg); padding: 24px; background: var(--tile); position: relative; overflow: hidden; min-width: 0; }
.tile-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.tile-head h2 { margin: 0; font-size: 18px; }
.tile-label { font-size: 13px; font-weight: 500; opacity: .7; }
.round-link { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--paper); color: var(--ink); text-decoration: none; flex: none; transition: transform .25s cubic-bezier(.16,1,.3,1), background .15s; }
.round-link:hover { transform: rotate(-45deg); background: var(--lime); color: var(--lime-ink); }
.round-link svg { width: 17px; height: 17px; }

.page:has(.hero) { padding-top: 40px; }
.hero {
  grid-column: 1 / -1; min-height: 420px; padding: 0; color: #fff; position: relative; isolation: isolate;
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
}
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: var(--r-lg);
  background:
    linear-gradient(162deg, transparent 38%, rgba(255,255,255,.10) 47%, transparent 56%),
    radial-gradient(90% 120% at 78% 0%, #9a6bff 0%, transparent 60%),
    radial-gradient(70% 90% at 0% 100%, #3f17b8 0%, transparent 70%),
    var(--violet);
  clip-path: var(--hero-clip, polygon(0 0, 84% 0, 100% 24%, 100% 100%, 0 100%));
}
.hero-copy { padding: 52px 0 34px 48px; display: flex; flex-direction: column; position: relative; z-index: 1; }
.display { font: 500 64px/1.14 var(--display); letter-spacing: -.02em; margin: 0; display: grid; gap: 0; }
.display > span { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.av-stack { display: inline-flex; align-items: center; flex: none; }
.av-stack .av { width: 50px; height: 50px; font-size: 18px; box-shadow: 0 0 0 3px var(--violet); margin-left: -12px; }
.av-stack .av:first-child { margin-left: 0; }
.av-stack .plus { width: 50px; height: 50px; margin-left: -12px; border-radius: 50%; background: #fff; color: #121212; display: grid; place-items: center; box-shadow: 0 0 0 3px var(--violet); font: 500 16px/1 var(--display); letter-spacing: 0; }
.brief { font-size: 16px; line-height: 1.65; text-wrap: pretty; margin: 20px 0 0; max-width: 44ch; color: rgba(255,255,255,.82); }
.brief strong { color: #fff; font-weight: 600; }
.hero-actions { margin-top: auto; padding-top: 28px; display: flex; gap: 8px; align-items: center; }
.hero-actions .btn.light { height: 48px; padding: 0 24px; font-size: 15px; }
.hero-actions .round-link { width: 48px; height: 48px; background: #fff; color: #121212; }
.hero-art { position: relative; min-height: 100%; }
.hero-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 22%); mask-image: linear-gradient(90deg, transparent 0%, #000 22%); }
.hero-art.cutout img { inset: auto 6% 0 auto; width: auto; height: 112%; max-width: 100%; object-fit: contain; object-position: bottom right; -webkit-mask-image: none; mask-image: none; filter: drop-shadow(0 24px 40px rgba(30,0,60,.35)); }
/* Green-screen video of the cat, keyed out in WebGL; the still image stays until the first frame is drawn */
.hero-art.cutout canvas.cat-video { position: absolute; inset: auto 6% 0 auto; height: 112%; width: auto; max-width: 100%; opacity: 0; transition: opacity .4s ease-out; filter: drop-shadow(0 24px 40px rgba(30,0,60,.35)); pointer-events: none; }
.hero-art.video-on canvas.cat-video { opacity: 1; }
.hero-art.video-on img { opacity: 0; }
.hero .hero-art canvas.cat-video { translate: calc(var(--px) * 18px) calc(var(--py) * 10px); }
@media (max-width: 860px) { .hero-art.cutout canvas.cat-video { left: 0; right: 0; margin: 0 auto; height: 104%; } }

/* ---------- Motion ---------- */
/* Desk intro: "the secretary arrives". JS adds .intro to <main> for ~1.4s, so every element's resting state is fully visible. */
@property --wipe { syntax: '<percentage>'; inherits: false; initial-value: 130%; }
.intro .hero::before { -webkit-mask-image: linear-gradient(100deg, #000 calc(var(--wipe) - 22%), transparent var(--wipe)); mask-image: linear-gradient(100deg, #000 calc(var(--wipe) - 22%), transparent var(--wipe)); animation: wipe .8s cubic-bezier(.16,1,.3,1) both; }
@keyframes wipe { from { --wipe: 0%; } }
.intro .display > span { animation: line-up .62s cubic-bezier(.16,1,.3,1) both; }
.intro .display > span:nth-child(1) { animation-delay: .12s; }
.intro .display > span:nth-child(2) { animation-delay: .2s; }
.intro .display > span:nth-child(3) { animation-delay: .28s; }
@keyframes line-up { from { clip-path: inset(0 0 100% 0); transform: translateY(45%); } to { clip-path: inset(-20% -10% -20% -10%); } }
.intro .brief, .intro .hero-actions { animation: rise .5s cubic-bezier(.16,1,.3,1) .38s both; }
.intro .hero-art img { animation: cat-in .85s cubic-bezier(.16,1,.3,1) .18s both; }
@keyframes cat-in { from { transform: translateY(90px) scale(.94) rotate(2deg); } }
.intro .bento > .tile { animation: rise .55s cubic-bezier(.16,1,.3,1) both; }
.intro .bento > .tile:nth-child(2) { animation-delay: .3s; }
.intro .bento > .tile:nth-child(3) { animation-delay: .35s; }
.intro .bento > .tile:nth-child(4) { animation-delay: .4s; }
.intro .bento > .tile:nth-child(n+5) { animation-delay: .45s; }
@keyframes rise { from { transform: translateY(22px); opacity: 0; } }

/* Ticking a task: tick draws, title strikes, then the row leaves */
.check.ticking { background: var(--lime); border-color: var(--lime); animation: tick-pop .26s cubic-bezier(.34,1.5,.64,1); }
.check.ticking svg { opacity: 1; stroke-dasharray: 24; animation: tick-draw .26s ease-out both; }
@keyframes tick-pop { 50% { transform: scale(1.18); } }
@keyframes tick-draw { from { stroke-dashoffset: 24; } }
li.leaving .t-title { text-decoration: line-through; color: var(--ink-3); transition: color .2s; }

/* ---------- Delight: the cat secretary ---------- */
.cat-hit { position: absolute; z-index: 3; right: 6%; bottom: 0; width: min(62%, 360px); height: 108%; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 45% 45% 0 0; }
.cat-hit:focus-visible { outline: 2px solid #fff; outline-offset: -8px; }
/* Backdrop behind the cat: today's date as a desk calendar, and a disc the cat stands on */
.hero-deco { position: absolute; inset: 0; pointer-events: none; }
.big-date { position: absolute; left: -2%; top: 50%; transform: translateY(-54%); font: 600 min(30vw, 360px)/.8 var(--display); letter-spacing: -.06em; color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.26); font-variant-numeric: tabular-nums; -webkit-text-stroke-color: rgba(255,255,255,.42); -webkit-text-stroke-width: 2px; }
.big-month { position: absolute; left: 1%; bottom: 9%; font: 500 15px/1 var(--display); letter-spacing: 0; color: rgba(255,255,255,.75); }
.disc { position: absolute; right: calc(6% + 8px); bottom: -14%; width: min(74%, 380px); aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.17); box-shadow: inset 0 0 0 2px rgba(255,255,255,.28), 0 0 0 26px rgba(255,255,255,.05); }
.intro .big-date { animation: date-in .9s cubic-bezier(.16,1,.3,1) .1s both; }
@keyframes date-in { from { transform: translateY(-44%); } }
.brief.says { display: flex; gap: 10px; align-items: flex-start; color: #fff; }
.brief .paw-mark { flex: none; width: 22px; height: 22px; margin-top: 1px; fill: var(--lime); }
.brief.swap { animation: says-in .32s cubic-bezier(.16,1,.3,1); }
@keyframes says-in { from { transform: translateY(8px); } }
.cat-hint { margin: 8px 0 0; font-size: 13px; color: rgba(255,255,255,.72); display: flex; align-items: center; gap: 6px; }
.cat-hint svg { width: 14px; height: 14px; fill: currentColor; }
.hero-art.hop img { animation: hop .46s cubic-bezier(.34,1.5,.64,1); }
@keyframes hop { 40% { transform: translateY(-16px) rotate(-2.5deg); } }
.paws { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.paws svg { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); fill: var(--c); animation: paw-burst 1.4s cubic-bezier(.16,1,.3,1) var(--d) both; }
@keyframes paw-burst { 0% { transform: translate(0, 0) scale(.2) rotate(0); opacity: 0; } 12% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(1) rotate(var(--r)); opacity: 0; } }
.card .stamp { position: absolute; left: 50%; top: 50%; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px 6px 10px; border-radius: 999px; background: var(--lime); color: var(--lime-ink); font: 600 13px/1 var(--display); box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 10px 22px -8px rgba(0,0,0,.45); transform: translate(-50%, -50%) rotate(-9deg); white-space: nowrap; }
.card .stamp svg { width: 16px; height: 16px; fill: currentColor; }
.card.just-done .stamp { animation: stamp-in .5s cubic-bezier(.34,1.7,.64,1) .2s both; }
@keyframes stamp-in { from { transform: translate(-50%, -50%) scale(2.4) rotate(-26deg); opacity: 0; } }

/* View transitions: page switches and cards moving between states */
.topnav { view-transition-name: topnav; }
::view-transition-old(root) { animation: .14s ease-out both vt-out; }
::view-transition-new(root) { animation: .3s cubic-bezier(.16,1,.3,1) both vt-in; }
@keyframes vt-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; transform: translateY(10px); } }
::view-transition-group(*) { animation-duration: .42s; animation-timing-function: cubic-bezier(.16,1,.3,1); }
::view-transition-old(*):only-child { animation: .18s ease-out both vt-out; }

.perf-tile { grid-column: span 4; background: var(--dark); color: var(--dark-ink); display: flex; flex-direction: column; min-height: 290px; }
.perf-tile .tile-label { color: var(--dark-2); opacity: 1; }
.perf-tile .lead { margin: 10px 0 0; font: 500 22px/1.4 var(--display); max-width: 20ch; }
.figs { display: grid; grid-template-columns: 1fr 1fr; margin-top: auto; padding-top: 26px; }
.figs div { display: grid; gap: 4px; padding-right: 16px; }
.figs div + div { padding-left: 22px; border-left: 1px solid #333; }
.figs > div > span { font-size: 13px; color: var(--dark-2); order: -1; }
.figs b { font: 300 58px/1 var(--display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.figs b small { font-size: 22px; font-weight: 400; margin-left: 2px; letter-spacing: 0; }

.shot { grid-column: span 4; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; min-height: 290px; }
.shot .play-btn { position: relative; z-index: 2; width: 46px; height: 46px; border-radius: 50%; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; text-decoration: none; transition: transform .2s; }
.shot .play-btn:hover { transform: scale(1.08); }
.shot .play-btn svg { width: 18px; height: 18px; }
.shot .art-wrap { position: absolute; right: -6%; top: 14%; width: 56%; transform: rotate(-7deg); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-lift); transition: transform .45s cubic-bezier(.16,1,.3,1); }
.shot:hover .art-wrap { transform: rotate(-3deg) translateY(-4px); }
.shot .cap { margin-top: auto; position: relative; z-index: 1; max-width: 46%; }
.shot .cap small { font-size: 13px; color: var(--ink-3); display: block; }
.shot .cap b { font-weight: 500; font-size: 15px; line-height: 1.5; display: block; margin-top: 2px; }
.shot .cap span { font-size: 13px; color: var(--ink-2); }

/* Weather tile: a light card with soft cloud banks, 3D-style icon top-left, big temperature */
.wx { grid-column: span 4; min-height: 290px; display: flex; flex-direction: column; color: #111318; background: #ffffff; box-shadow: inset 0 0 0 1px #e6e9ef; }
/* The building stage: image plus effects masked to its shape. Layers shift with --px/--py for parallax. */
/* 3D tilt under the pointer for every box; --px/--py run -0.5..0.5 and also drive inner parallax layers */
.tile, .hero, .card, .post, .tip, .ref, .agenda, .col { --px: 0; --py: 0; --tilt: 3deg; }
.hero, .post, .tip, .agenda { --tilt: 1.6deg; }
.tile, .hero, .post, .tip, .agenda, .col { transition: transform .5s cubic-bezier(.16,1,.3,1); }
.tilting { transform: perspective(900px) rotateY(calc(var(--px) * var(--tilt))) rotateX(calc(var(--py) * var(--tilt) * -1)); }
.card.tilting { transform: perspective(700px) translateY(-3px) rotateY(calc(var(--px) * 6deg)) rotateX(calc(var(--py) * -6deg)); }
.ref.tilting { transform: perspective(700px) rotateY(calc(var(--px) * 8deg)) rotateX(calc(var(--py) * -8deg)); }
.hero .display { translate: calc(var(--px) * -10px) calc(var(--py) * -6px); transition: translate .6s cubic-bezier(.16,1,.3,1); }
.hero .hero-art img { translate: calc(var(--px) * 18px) calc(var(--py) * 10px); transition: translate .6s cubic-bezier(.16,1,.3,1); }
.hero .big-date { translate: calc(var(--px) * 8px) 0; transition: translate .8s cubic-bezier(.16,1,.3,1); }
.hero .disc { translate: calc(var(--px) * 10px) calc(var(--py) * 6px); transition: translate .7s cubic-bezier(.16,1,.3,1); }
.wx-stage { position: absolute; right: -20%; bottom: -3%; height: 76%; aspect-ratio: 1400 / 842; max-width: 92%; -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,.25) 0%, #000 22%, #000 90%, transparent 100%); mask-image: linear-gradient(90deg, rgba(0,0,0,.25) 0%, #000 22%, #000 90%, transparent 100%); z-index: 1; pointer-events: none; transition: opacity .3s, translate .6s cubic-bezier(.16,1,.3,1); translate: calc(var(--px) * 12px) calc(var(--py) * 8px); }
.wx-scene { width: 100%; height: 100%; object-fit: contain; object-position: right bottom; filter: drop-shadow(0 14px 26px rgba(30,40,70,.18)) drop-shadow(0 2px 4px rgba(30,40,70,.12)); }
.wx-icon, .wx-temp { transition: translate .6s cubic-bezier(.16,1,.3,1); }
.wx-icon { translate: calc(var(--px) * -10px) calc(var(--py) * -6px); }
.wx-bank { translate: calc(var(--px) * 22px) 0; transition: translate .8s cubic-bezier(.16,1,.3,1); }
/* effects masked to the building's silhouette */
.wx-mask { position: absolute; inset: 0; -webkit-mask: var(--scene) right bottom / contain no-repeat; mask: var(--scene) right bottom / contain no-repeat; display: none; }
.wx-shine { background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.95) 47%, rgba(255,240,200,.6) 50%, transparent 58%) no-repeat; background-size: 260% 100%; background-position: 160% 0; animation: shine 5.5s cubic-bezier(.45,0,.25,1) infinite; }
@keyframes shine { 0%, 45% { background-position: 160% 0; } 85%, 100% { background-position: -60% 0; } }
.wx-lights { background: radial-gradient(12% 26% at 32% 64%, rgba(255,196,110,.9), rgba(255,196,110,0) 72%), radial-gradient(16% 30% at 65% 62%, rgba(255,206,130,.9), rgba(255,206,130,0) 72%), radial-gradient(6% 22% at 92% 64%, rgba(255,206,130,.7), rgba(255,206,130,0) 72%), radial-gradient(5% 20% at 8% 66%, rgba(255,206,130,.55), rgba(255,206,130,0) 72%); mix-blend-mode: multiply; animation: lights-on 1.6s ease-out .3s both, lights-flicker 7s ease-in-out 2s infinite; }
@keyframes lights-on { from { opacity: 0; } }
@keyframes lights-flicker { 50% { opacity: .82; } }
.wx-dusk { background: linear-gradient(180deg, rgba(70,74,150,.28), rgba(40,40,110,.36)); mix-blend-mode: multiply; }
.wx.sky-clear .wx-shine, .wx.sun-peek .wx-shine, .wx.sky-night .wx-lights, .wx.sky-night .wx-dusk { display: block; }
.wx.sky-storm .wx-scene { animation: lit 3.4s steps(1) infinite; }
@keyframes lit { 0%, 63%, 65%, 100% { filter: drop-shadow(0 14px 26px rgba(30,40,70,.18)) brightness(.9); } 64% { filter: drop-shadow(0 0 30px rgba(255,255,255,.9)) brightness(1.25); } }
/* splashes on the roof edge when it rains */
.wx-splash { position: absolute; width: 16px; height: 6px; margin: -3px 0 0 -8px; border-radius: 50%; border: 1.5px solid rgba(120,145,185,.85); border-top-color: transparent; opacity: 0; display: none; animation: splash 1.1s ease-out infinite; }
.wx.sky-rain .wx-splash, .wx.sky-storm .wx-splash { display: block; }
@keyframes splash { 0% { transform: scale(.2); opacity: 0; } 15% { opacity: 1; } 100% { transform: scale(1.6) translateY(-4px); opacity: 0; } }
/* lightning bolt in the open sky */
.wx-bolt { position: absolute; left: 34%; top: 0; width: 70px; height: 62%; z-index: 1; display: none; overflow: visible; opacity: 0; filter: drop-shadow(0 0 6px #fff7c0) drop-shadow(0 0 14px #ffd84d); animation: bolt 3.4s steps(1) infinite; }
.wx.sky-storm .wx-bolt { display: block; }
/* stars at night */
.wx-star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #8f8fd8; box-shadow: 0 0 6px #b9b9ff; display: none; animation: twinkle 3s ease-in-out infinite; }
.wx.sky-night .wx-star { display: block; }
@keyframes twinkle { 50% { opacity: .2; scale: .6; } }
/* birds on a sunny day */
.wx-birds { position: absolute; left: 0; top: 16%; width: 54px; height: 22px; z-index: 1; display: none; color: #4a5367; animation: birds 14s linear infinite; }
.wx.sky-clear .wx-birds, .wx.sun-peek .wx-birds { display: block; }
.wx-birds path { animation: flap .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.wx-birds path + path { animation-delay: .2s; }
@keyframes flap { to { scale: 1 .35; } }
@keyframes birds { 0% { translate: -60px 20px; opacity: 0; } 8% { opacity: 1; } 60% { opacity: 1; } 70%, 100% { translate: 105cqi -10px; opacity: 0; } }
/* leaves carried by the real wind */
.wx-leaf { position: absolute; left: 0; top: var(--y); width: 16px; height: 16px; z-index: 2; color: var(--c); pointer-events: none; animation: leaf var(--d) linear var(--delay) infinite; opacity: 0; }
@keyframes leaf { 0% { translate: -30px 0; rotate: 0deg; opacity: 0; } 8% { opacity: .95; } 30% { translate: 30cqi 18px; } 55% { translate: 60cqi -6px; } 80% { translate: 90cqi 22px; opacity: .95; } 100% { translate: 110cqi 10px; rotate: 540deg; opacity: 0; } }
.wx-bank { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(9px); }
.wx-bank.b1 { width: 74%; height: 62%; right: -22%; bottom: -16%; background: radial-gradient(closest-side at 45% 35%, #ffffff 0%, #ffffff 38%, #d9e0eb 72%, rgba(217,224,235,0) 100%); animation: bank 30s ease-in-out infinite alternate; }
.wx-bank.b2 { width: 56%; height: 44%; right: 8%; bottom: 14%; background: radial-gradient(closest-side at 40% 32%, #ffffff 0%, #ffffff 30%, #d3dbe8 70%, rgba(211,219,232,0) 100%); animation: bank 38s ease-in-out infinite alternate-reverse; }
.wx-bank.b3 { width: 48%; height: 40%; right: -10%; top: 6%; background: radial-gradient(closest-side, rgba(255,255,255,.95) 0%, rgba(232,237,245,.6) 60%, rgba(232,237,245,0) 100%); animation: bank 44s ease-in-out infinite alternate; }
/* Weather around the scene: the scene image is just the building; the sky is drawn per condition */
.wx-sunglow, .wx-rainfx { position: absolute; pointer-events: none; display: none; }
.wx-sunglow { right: -14%; top: -30%; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,200,80,.75) 0%, rgba(255,210,100,.35) 45%, rgba(255,214,102,0) 100%); animation: sunglow 6s ease-in-out infinite; }
@keyframes sunglow { 50% { scale: 1.08; opacity: .8; } }
.wx-rainfx { right: 0; top: 0; bottom: 0; width: 52%; z-index: 1; background: repeating-linear-gradient(104deg, rgba(100,122,160,0) 0 17px, rgba(100,122,160,.4) 17px 18.5px), repeating-linear-gradient(100deg, rgba(100,122,160,0) 0 29px, rgba(100,122,160,.28) 29px 30px); background-size: 60px 120px, 90px 160px; -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 45%), linear-gradient(transparent 0%, #000 20%, #000 80%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0%, #000 45%); -webkit-mask-composite: source-in; mask-composite: intersect; animation: rainfall .5s linear infinite; }
@keyframes rainfall { to { background-position: -14px 120px, -18px 160px; } }
.wx.sky-clear .wx-sunglow, .wx.sun-peek .wx-sunglow { display: block; }
.wx.sun-peek .wx-sunglow { opacity: .65; }
.wx.sky-clear .wx-bank.b2, .wx.sky-clear .wx-bank.b3 { display: none; }
.wx.sky-rain .wx-rainfx, .wx.sky-storm .wx-rainfx { display: block; }
.wx.sky-storm .wx-rainfx { background-image: repeating-linear-gradient(104deg, rgba(90,105,135,0) 0 11px, rgba(90,105,135,.45) 11px 12.5px); animation-duration: .35s; }
.wx.sky-storm::after { content: ""; position: absolute; inset: 0; z-index: 1; background: #ffffff; opacity: 0; pointer-events: none; animation: flash 3.4s steps(1) infinite; }
@keyframes flash { 0%, 63%, 65%, 100% { opacity: 0; } 64% { opacity: .55; } }
.wx.sky-storm { background: linear-gradient(170deg, #ffffff 0%, #eef1f6 100%); }
.wx.sky-night { background: linear-gradient(170deg, #f4f4fd 0%, #e7e8f8 100%); }
.wx.sky-night .wx-bank.b1, .wx.sky-night .wx-bank.b2 { filter: blur(9px) hue-rotate(10deg); opacity: .9; }
.wx.sky-rain .wx-bank.b2, .wx.sky-storm .wx-bank.b2 { background: radial-gradient(closest-side at 40% 40%, #e3e7ee 0%, #bfc8d6 60%, rgba(190,200,214,0) 100%); }
@keyframes bank { to { transform: translateX(-12%); } }
.wx-icon { position: relative; z-index: 2; width: 116px; height: 104px; margin: -10px 0 0 -8px; }
.wx-icon img { width: 100%; height: 100%; object-fit: contain; animation: icon-bob 6s ease-in-out infinite; }
@keyframes icon-bob { 50% { translate: 0 -4px; } }
.wx-art { width: 100%; height: 100%; overflow: visible; }
.wx-art .wx-cloud { animation: cloud-bob 5.5s ease-in-out infinite; }
.wx-art .wx-cloud.back { animation-duration: 7s; animation-direction: reverse; }
@keyframes cloud-bob { 50% { translate: 4px -3px; } }
.wx-art .wx-orb { animation: orb-float 7s ease-in-out infinite; }
@keyframes orb-float { 50% { translate: 0 -3px; } }
.wx-art .wx-glow { transform-box: fill-box; transform-origin: center; animation: glow 3.6s ease-in-out infinite; }
@keyframes glow { 50% { scale: 1.12; opacity: .12; } }
.wx-art .wx-drop { animation: drop 1.15s cubic-bezier(.55,0,.8,.6) infinite; opacity: 0; }
@keyframes drop { 0% { translate: 0 -6px; opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { translate: -4px 22px; opacity: 0; } }
.wx-art .wx-bolt { animation: bolt 3.4s steps(1) infinite; opacity: 0; }
@keyframes bolt { 0%, 62%, 70%, 100% { opacity: 0; } 64%, 68% { opacity: 1; } }
.wx-art .wx-fog { animation: fog 4s ease-in-out infinite alternate; }
@keyframes fog { to { translate: 6px 0; } }
.wx.paused *, .wx.paused::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) {
  .wx *, .wx::after { animation: none !important; }
  .wx-art .wx-drop, .wx-art .wx-bolt { opacity: 1; }
}
.wx-flip { position: absolute; top: 18px; right: 18px; z-index: 3; width: 44px; height: 44px; border: 0; border-radius: 50%; background: #111318; color: #fff; display: grid; place-items: center; cursor: pointer; transition: transform .25s cubic-bezier(.16,1,.3,1), background .15s; }
.wx-flip:hover { transform: rotate(-45deg); }
.wx-flip[aria-pressed="true"] { transform: rotate(180deg); }
.wx-flip svg { width: 18px; height: 18px; }
.wx-temp { font: 500 68px/1 var(--display); letter-spacing: -.04em; margin-top: auto; position: relative; z-index: 2; font-variant-numeric: tabular-nums; }
.wx-feel { margin: 10px 0 0; font-size: 15px; font-weight: 500; position: relative; z-index: 2; }
.wx-wind { margin: 4px 0 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #4a5060; position: relative; z-index: 2; }
.wx-wind svg { width: 14px; height: 14px; }
.wx-place { margin: 2px 0 0; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6a7080; position: relative; z-index: 2; }
.wx-place svg { width: 13px; height: 13px; }
.wx-place.off { color: #b4530a; font-weight: 500; }
.wx-title { font: 600 18px/1.4 var(--display); margin: 0; position: relative; z-index: 2; }
.wx-hours { list-style: none; margin: auto 0 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; position: relative; z-index: 2; }
.wx-hours li { display: grid; justify-items: center; gap: 6px; padding: 10px 0 12px; border-radius: 999px; background: rgba(255,255,255,.7); font-size: 12px; color: #4a5060; font-variant-numeric: tabular-nums; }
.wx-hours li:first-child { background: #111318; color: #fff; }
.wx-hours .mini { width: 34px; height: 30px; }
.wx-hours .mini img, .wx-hours .mini svg { width: 100%; height: 100%; }
.wx-hours b { font: 600 15px/1 var(--display); color: inherit; }
.wx-hours li:first-child b { color: #fff; }
.wx-hours li:not(:first-child) b { color: #111318; }
.wx-range { margin: 6px 0 0; font-size: 13px; color: #4a5060; position: relative; z-index: 2; }
/* One view at a time: the arrow flips between now and the hourly forecast. The building fills the right side. */
.wx { container-type: inline-size; }
.wx-body { flex: 1; display: flex; min-height: 0; position: relative; z-index: 2; }
.wx-now, .wx-later { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.wx-later { display: none; }
.wx-body.show-hours .wx-now { display: none; }
.wx-body.show-hours .wx-later { display: flex; }
.wx:has(.show-hours) .wx-stage { opacity: .18; }
@container (min-width: 640px) {
  .wx-stage { height: 104%; right: -6%; bottom: -8%; }
  .wx-hours li { padding: 14px 0 16px; }
  .wx-hours .mini { width: 44px; height: 38px; }
}

.focus { grid-column: span 5; }
.sched { grid-column: span 4; }
.ann { grid-column: span 3; background: var(--yellow); color: var(--yellow-ink); }
.ann .big { font: 300 64px/1 var(--display); letter-spacing: -.04em; }
.ann .big small { font: 500 15px/1.45 var(--font); letter-spacing: 0; display: block; margin-top: 8px; }
.ann ul { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.ann li a { display: block; text-decoration: none; font-size: 15px; font-weight: 500; line-height: 1.5; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.55); transition: background .15s; }
.ann li a:hover { background: #fff; }
.ann li small { display: block; font-weight: 400; opacity: .75; font-size: 13px; }
.ann .round-link { background: rgba(255,255,255,.7); color: var(--yellow-ink); }

.tasklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tasklist li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px 10px 10px; border-radius: 16px; background: var(--paper); }
.tasklist .t-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; line-height: 1.5; }
.tasklist .t-meta { font-size: 13px; color: var(--ink-3); display: flex; gap: 8px; flex-wrap: wrap; }
.tasklist .t-chips { display: flex; gap: 4px; align-items: center; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--paper); cursor: pointer; display: grid; place-items: center; padding: 0; transition: background .15s, border-color .15s, transform .15s; }
.check { position: relative; }
.check::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; }
.check:hover { border-color: var(--ink); }
.check:active { transform: scale(.9); }
.check svg { width: 15px; height: 15px; stroke-width: 2.6; opacity: 0; color: var(--lime-ink); }
.check.on { background: var(--lime); border-color: var(--lime); }
.check.on svg { opacity: 1; }
li.is-done .t-title { text-decoration: line-through; color: var(--ink-3); }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.timeline li { display: grid; grid-template-columns: 50px 1fr; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--paper); align-items: start; }
.timeline time { font: 600 14px/1.5 var(--display); font-variant-numeric: tabular-nums; }
.timeline .ev { font-size: 15px; font-weight: 500; line-height: 1.5; min-width: 0; }
.timeline .ev small { display: flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 13px; font-weight: 400; margin-top: 2px; }
.timeline .ev small svg { width: 13px; height: 13px; }
.timeline .ev.deadline > div::before { content: "ส่งงาน · "; color: var(--warn); }
.timeline li.past { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.timeline li.past time { color: var(--ink-3); font-weight: 500; }
.timeline li.past .ev > div { color: var(--ink-2); }
.timeline li.now { background: var(--btn); color: var(--btn-ink); }
.timeline li.now small { color: inherit; opacity: .75; }
.sched .done-note { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.sched .done-note svg { color: var(--green); }

/* ---------- Board ---------- */
.board-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.board-tools select.input { width: auto; padding-right: 36px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
.col { min-height: 320px; border-radius: var(--r-lg); padding: 14px; background: var(--tile); transition: background .2s ease-out, box-shadow .2s ease-out; }
.col.over { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--violet); }
.col-head { display: flex; align-items: center; gap: 10px; padding: 4px 4px 14px; }
.col-head h2 { font: 600 18px/1.4 var(--display); margin: 0; }
.col-head .n { margin-left: auto; font-size: 12px; font-weight: 600; min-width: 28px; height: 28px; display: inline-grid; place-items: center; padding: 0 8px; border-radius: 999px; background: var(--paper); font-variant-numeric: tabular-nums; }
.col[data-col="doing"] .col-head .n { background: var(--violet); color: #fff; }
.col[data-col="review"] .col-head .n { background: var(--yellow); color: var(--yellow-ink); }
.col[data-col="done"] .col-head .n { background: var(--lime); color: var(--lime-ink); }
.cards { display: grid; gap: 12px; min-height: 40px; }
.card { display: grid; gap: 0; cursor: grab; background: var(--paper); border-radius: 20px; padding: 8px; transition: box-shadow .22s ease-out, transform .22s cubic-bezier(.16,1,.3,1); }
.card:hover { box-shadow: var(--shadow-lift); transform: translateY(-3px); }
.card.dragging { opacity: .35; }
.card .frame { position: relative; border-radius: 14px; overflow: hidden; }
.card .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
.card .badges { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
.card .ver { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: #fff; color: #121212; }
.card .urgent { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--danger); color: #fff; }
.card .cap { display: grid; gap: 2px; padding: 10px 6px 4px; }
.card .client { font-size: 13px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.card .client .av { width: 24px; height: 24px; font-size: 10px; }
.card .title { font-weight: 500; line-height: 1.5; font-size: 15px; }
.card-foot { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin-top: 8px; }
.card-foot .due { white-space: nowrap; font-size: 13px; color: var(--ink-3); display: inline-flex; gap: 4px; align-items: center; }
.card-foot .due svg { width: 13px; height: 13px; }
.card-foot .due.late { color: var(--danger); font-weight: 600; }
.card-foot .due.soon { color: var(--warn); font-weight: 600; }
.move { display: inline-flex; align-items: center; gap: 4px; border: 0; background: var(--tile); border-radius: 999px; height: 34px; padding: 0 14px; font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
.move:hover { background: var(--btn); color: var(--btn-ink); }
.move svg { width: 13px; height: 13px; }
.art { --bg: #ddd; --fg: #222; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 9% 9% 8%; background: var(--bg); color: var(--fg); overflow: hidden; container-type: inline-size; }
.art .k { font-size: 8cqi; letter-spacing: 0; opacity: .8; font-weight: 600; position: relative; z-index: 1; }
.art b { font: 600 11.5cqi/1.1 var(--display); letter-spacing: -.02em; position: relative; z-index: 1; max-width: 88%; text-wrap: balance; }
.art small { font-size: 6.5cqi; font-weight: 500; position: relative; z-index: 1; }
.art .s { position: absolute; background: var(--fg); opacity: .16; }
.art.v0 .s { width: 62%; aspect-ratio: 1; border-radius: 50%; right: -14%; top: 12%; }
.art.v1 .s { inset: auto 0 0 0; height: 38%; opacity: .14; }
.art.v2 .s { inset: 6%; background: none; border: 1.5px solid var(--fg); opacity: .35; border-radius: 10px; }
.art .play { position: absolute; inset: auto 9% 8% auto; width: 16%; z-index: 1; }
.art .play span { width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.art .play svg { width: 45%; height: 45%; fill: currentColor; stroke: none; }
.art.t-banner { justify-content: center; padding: 5% 7%; }
.art.t-banner .k, .art.t-banner small { display: none; }
.art.t-banner b { font-size: 7cqi; max-width: 70%; }
.art.empty { background: var(--tile); color: var(--ink-3); flex-direction: row; justify-content: flex-start; align-items: center; text-align: left; gap: 12px; padding: 0 16px; }
.art.empty svg { width: 22px; height: 22px; }
.art.empty p { margin: 0; font-size: 13px; max-width: 26ch; }
.add-inline { width: 100%; justify-content: center; margin-top: 12px; background: var(--paper); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,10,12,.4); opacity: 0; pointer-events: none; transition: opacity .2s ease-out; z-index: 40; }
.drawer { position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(460px, calc(100vw - 24px)); background: var(--paper); border-radius: var(--r-xl); box-shadow: var(--shadow-lift); transform: translateX(110%); transition: transform .28s cubic-bezier(.16,1,.3,1); z-index: 50; display: flex; flex-direction: column; overflow: hidden; }
.drawer.open { transform: none; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer header { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px 8px; }
.drawer header h2 { margin: 0; font: 600 26px/1.3 var(--display); letter-spacing: -.01em; }
.drawer form { padding: 16px 24px; display: grid; gap: 14px; overflow-y: auto; flex: 1; align-content: start; }
.drawer .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.drawer footer { display: flex; gap: 8px; padding: 16px 24px 22px; }
.drawer footer .spacer { flex: 1; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
.toggle input { width: 20px; height: 20px; accent-color: var(--ink); }

/* ---------- Calendar ---------- */
.cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
.cal-nav { display: flex; align-items: center; gap: 8px; }
.cal-nav h2 { margin: 0 8px; min-width: 150px; text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; background: var(--tile); border-radius: var(--r-lg); padding: 14px; }
.cal .dow { padding: 4px 8px 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.cal button.day { min-height: 104px; padding: 8px; border: 0; border-radius: 16px; background: var(--paper); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: box-shadow .15s, transform .15s; }
.cal button.day:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.cal .day .d { font: 600 13px/1 var(--display); font-variant-numeric: tabular-nums; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; }
.cal .day.out { background: transparent; }
.cal .day.out .d { color: var(--ink-3); font-weight: 500; }
.cal .day.today .d { background: var(--violet); color: #fff; }
.cal .day[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.cal .day .e { font-size: 12px; line-height: 1.45; padding: 4px 8px; border-radius: 8px; background: var(--tile); color: var(--ink-2); overflow: hidden; max-width: 100%; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.cal .day .e.meeting { background: var(--accent-soft); color: var(--violet); }
:root[data-theme="dark"] .cal .day .e.meeting { color: var(--accent); }
.cal .day .e.deadline { background: var(--yellow); color: var(--yellow-ink); }
.cal .day .more { font-size: 11px; color: var(--ink-3); padding-left: 6px; }
.agenda { background: var(--tile); border-radius: var(--r-lg); padding: 24px; }
.agenda h2 { font-size: 22px; line-height: 1.4; letter-spacing: 0; }
.add-ev { display: grid; gap: 10px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line-strong); }
.add-ev .row { display: grid; grid-template-columns: 116px 1fr; gap: 8px; }
.agenda .input { background: var(--paper); }

/* ---------- News ---------- */
.news { display: grid; grid-template-columns: minmax(0, 760px); gap: 12px; }
.composer { background: var(--tile); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 12px; margin-bottom: 12px; }
.composer textarea { border: 0; resize: vertical; min-height: 60px; background: transparent; padding: 4px 2px; font-size: 16px; }
.composer textarea:focus { outline: none; }
.composer-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.post { padding: 24px; border-radius: var(--r-lg); background: var(--tile); display: grid; grid-template-columns: 42px 1fr; gap: 16px; }
.post-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.post-head b { font-weight: 600; }
.post-head small { color: var(--ink-3); font-size: 13px; }
.post h3 { font: 600 22px/1.4 var(--display); margin: 8px 0 8px; letter-spacing: 0; }
.post p { margin: 0; color: var(--ink-2); max-width: 66ch; white-space: pre-line; font-size: 16px; text-wrap: pretty; }
.post-foot { display: flex; align-items: center; gap: 12px; margin-top: 16px; font-size: 13px; color: var(--ink-3); flex-wrap: wrap; }
.post.pinned { background: var(--violet); color: #fff; }
.post.pinned p, .post.pinned .post-head small, .post.pinned .post-foot { color: rgba(255,255,255,.82); }
.post.pinned .chip.ok { background: var(--lime); }
.post.pinned .btn:not(.primary) { background: rgba(255,255,255,.18); color: #fff; }
.post.pinned .btn.primary { background: #fff; color: #121212; }
.stack { display: flex; }
.stack .av { width: 26px; height: 26px; font-size: 10px; box-shadow: 0 0 0 2px var(--tile); margin-left: -7px; }
.post.pinned .stack .av { box-shadow: 0 0 0 2px var(--violet); }
.stack .av:first-child { margin-left: 0; }

/* ---------- Ideas ---------- */
.spark { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; padding: 32px; border-radius: var(--r-lg); margin-bottom: 32px; background: var(--green); color: #fff; position: relative; overflow: hidden; }
.spark small { display: inline-block; margin-top: 16px; font-size: 13px; font-weight: 500; background: var(--yellow); color: var(--yellow-ink); padding: 4px 12px; border-radius: 999px; }
.spark p { font: 600 30px/1.35 var(--display); letter-spacing: -.01em; margin: 0; max-width: 28ch; text-wrap: balance; }
.spark .btn { background: #fff; color: #121212; }
.spark .btn:hover { background: var(--yellow); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filters button { border: 0; background: var(--tile); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--ink-2); transition: background .15s, color .15s; }
.filters button:hover { background: var(--line-strong); }
.filters button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.masonry { columns: 4 220px; column-gap: 12px; }
.ref { break-inside: avoid; margin: 0 0 14px; position: relative; border-radius: 20px; background: var(--tile); }
.ref img { display: block; width: 100%; height: auto; border-radius: 20px; }
/* ---------- Hand-drawn layer: marker highlights, pen doodles, washi tape ---------- */
.mark { position: relative; z-index: 0; color: #121212; padding: 0 .06em; white-space: nowrap; }
.mark::before { content: ""; position: absolute; z-index: -1; left: -.1em; right: -.1em; bottom: .04em; height: .5em; background: var(--yellow); border-radius: .5em .2em .45em .25em / .4em .3em .5em .3em; transform: rotate(-1.4deg) skewX(-10deg); transform-origin: left center; animation: mark-in .7s cubic-bezier(.16,1,.3,1) .25s both; }
@keyframes mark-in { from { scale: 0 1; } }
/* The cat stays still (a generated video loop will replace the image); it only slides in once on arrival */
.intro .hero-art.cutout img { animation: cat-in .85s cubic-bezier(.16,1,.3,1) .18s both; }
/* Greeting: small hello, the person's name large with their avatar */
.hello-small { margin: 0; font: 500 22px/1.3 var(--display); color: rgba(255,255,255,.85); }
.display.who-big { display: flex; align-items: center; gap: 18px; font-size: 88px; line-height: 1.12; letter-spacing: -.025em; margin: 6px 0 0; }
.who-big .av { display: inline-grid; place-items: center; gap: 0; width: 76px; height: 76px; font-size: 32px; letter-spacing: 0; box-shadow: 0 0 0 4px rgba(255,255,255,.28); }
.who-big > span { white-space: nowrap; }
.brief .hot { color: var(--lime); font-weight: 600; }
@media (max-width: 1240px) { .display.who-big { font-size: 72px; } .who-big .av { width: 64px; height: 64px; font-size: 26px; } }
@media (max-width: 860px) { .hello-small { font-size: 18px; } .display.who-big { font-size: 52px; gap: 12px; } .who-big .av { width: 48px; height: 48px; font-size: 20px; } }
.intro .hello-small { animation: rise .5s cubic-bezier(.16,1,.3,1) .08s both; }
.intro .who-big { animation: line-up .7s cubic-bezier(.16,1,.3,1) .16s both; }
/* On the purple hero the marker becomes a full-height yellow label, so the dark text never sits on purple */
.display .mark { padding: 0 .16em; margin-left: -.16em; }
.display > span:has(> .mark) { margin-top: .3em; }
.display .mark::before { animation: none; top: -.04em; bottom: .02em; height: auto; left: 0; right: 0; border-radius: .14em .22em .16em .26em; transform: rotate(-1.2deg); }
.ddl { overflow: visible; pointer-events: none; color: var(--ink); }
.ddl path { stroke-dasharray: 1; animation: ddl-draw .9s cubic-bezier(.65,0,.35,1) .4s both; }
@keyframes ddl-draw { from { stroke-dashoffset: 1; } }
.page-head h1 .ddl { display: inline-block; vertical-align: top; width: 36px; height: 36px; margin: -8px 0 0 8px; color: var(--violet); }
.page-head h1 .ddl-loop { width: 66px; height: 38px; margin-top: -2px; }
.page-head h1 .ddl-squiggle { width: 74px; height: 14px; margin: 26px 0 0 10px; }
.hero-copy > .ddl-quote { position: absolute; left: 14px; top: 16px; width: 30px; height: 30px; color: var(--lime); }
.tile-head h2 .mark { color: inherit; }
.circled { position: relative; display: inline-block; padding: 0 .12em; }
.circled .ddl { position: absolute; left: -38%; top: -26%; width: 176%; height: 150%; color: var(--yellow-ink); }
/* washi tape on idea refs and the pinned post */
.ref { transition: rotate .3s cubic-bezier(.16,1,.3,1), translate .3s cubic-bezier(.16,1,.3,1); }
.ref:nth-child(odd) { rotate: -1.2deg; }
.ref:nth-child(even) { rotate: 1deg; }
.ref:hover { rotate: 0deg; translate: 0 -4px; }
.ref::before, .post.pinned::before { content: ""; position: absolute; z-index: 3; width: 74px; height: 22px; top: -10px; left: 50%; translate: -50% 0; rotate: -4deg; background: var(--tape, rgba(255,226,106,.82)); clip-path: polygon(0 8%, 4% 0, 8% 10%, 12% 0, 16% 8%, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.ref:nth-child(4n+2)::before { --tape: rgba(214,242,106,.85); rotate: 5deg; }
.ref:nth-child(4n+3)::before { --tape: rgba(186,168,255,.8); rotate: -6deg; }
.ref:nth-child(4n)::before { --tape: rgba(255,175,150,.8); rotate: 3deg; }
.masonry { padding-top: 10px; }
.post.pinned { position: relative; }
.post.pinned::before { left: 28px; translate: 0 0; rotate: -8deg; }
.ref figcaption { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 10px 14px; border-radius: 14px; background: #fff; color: #121212; font-size: 13px; display: grid; gap: 2px; transform: translateY(8px); opacity: 0; transition: opacity .2s ease-out, transform .25s cubic-bezier(.16,1,.3,1); }
.ref:hover figcaption, .ref:focus-within figcaption { opacity: 1; transform: none; }
.ref figcaption span { color: #66676d; font-size: 12px; }
.add-ref { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.add-ref .input { flex: 1 1 260px; width: auto; }
.add-ref select { flex: 0 0 150px; }
.tips { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.tip { padding: 24px; border-radius: var(--r-lg); background: var(--tile); display: grid; gap: 10px; align-content: start; }
.tip:nth-child(3n+1) { background: var(--dark); color: var(--dark-ink); }
.tip:nth-child(3n+1) p, .tip:nth-child(3n+1) footer, .tip:nth-child(3n+1) ol { color: var(--dark-2); }
.tip:nth-child(3n+1) summary { color: var(--lime); }
.tip h3 { font: 600 22px/1.4 var(--display); letter-spacing: 0; }
.tip p { margin: 0; color: var(--ink-2); font-size: 16px; text-wrap: pretty; }
.tip footer { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-3); }
.tip:nth-child(3n+1) .chip { background: var(--lime); color: var(--lime-ink); }
.tip details summary { cursor: pointer; color: var(--violet); font-weight: 600; font-size: 14px; }
.tip ol { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); }

/* ---------- Team ---------- */
.table-wrap { overflow-x: auto; background: var(--tile); border-radius: var(--r-lg); padding: 8px; }
table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-3); padding: 8px 16px; white-space: nowrap; }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button:hover { color: var(--ink); }
th button svg { width: 13px; height: 13px; }
td { padding: 10px 16px; background: var(--paper); white-space: nowrap; }
td:first-child { border-radius: 16px 0 0 16px; }
td:last-child { border-radius: 0 16px 16px 0; }
tbody tr td { transition: background .15s; }
tbody tr:hover td { background: var(--lime); color: var(--lime-ink); }
tbody tr:hover .muted, tbody tr:hover small { color: var(--lime-ink); }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; width: 1%; }
.ref figcaption b { font-weight: 600; }
.person { display: flex; align-items: center; gap: 12px; }
.person small { display: block; color: var(--ink-3); font-size: 13px; }
.meter { display: inline-block; width: 70px; height: 8px; background: var(--tile); border-radius: 999px; vertical-align: middle; margin-right: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 999px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--btn); color: var(--btn-ink); padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-lift); transition: opacity .2s ease-out, transform .26s cubic-bezier(.16,1,.3,1); z-index: 60; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Responsive ---------- */
@media (max-width: 1240px) {
  .perf-tile, .shot, .wx { grid-column: span 6; }
  .wx { grid-column: 1 / -1; }
  .focus { grid-column: span 7; }
  .sched { grid-column: span 5; }
  .ann { grid-column: 1 / -1; }
  .display { font-size: 52px; }
  .cal-wrap { grid-template-columns: 1fr; }
}
@media (max-width: 980px) {
  .menu-btn { display: inline-grid; }
  .nav { position: fixed; z-index: 45; top: 74px; left: 12px; right: 12px; margin: 0; flex-direction: column; gap: 2px; padding: 10px; background: var(--paper); border-radius: var(--r-lg); box-shadow: var(--shadow-lift); opacity: 0; pointer-events: none; transform: translateY(-8px); transition: opacity .2s ease-out, transform .24s cubic-bezier(.16,1,.3,1); }
  .nav.open { opacity: 1; pointer-events: auto; transform: none; }
  .nav a { padding: 12px 14px; font-size: 16px; }
  .nav a svg { display: block; }
  .nav .count { margin-left: auto; }
  .topnav-end { margin-left: auto; }
}
@media (max-width: 860px) {
  .app { margin: 0; border-radius: 0; min-height: 100vh; box-shadow: none; }
  .topnav { padding: 12px 16px; border-radius: 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .who select { width: 0; flex: 0 0 0; padding: 0; opacity: 0; position: absolute; inset: 0; width: 100%; }
  .who { position: relative; padding: 4px; }
  #themeBtn { width: 36px; height: 36px; }
  main { padding: 12px 12px 48px; }
  .page:not(:has(.bento)) { padding: 8px 4px 0; }
  .bento { gap: 10px; }
  .perf-tile, .shot, .wx, .focus, .sched, .ann { grid-column: 1 / -1; }
  .page:has(.hero) { padding-top: 28px; }
  .hero { grid-template-columns: 1fr; }
  .hero-art.cutout { min-height: 250px; }
  .display > span:nth-child(2) { flex-wrap: wrap; white-space: normal; }
  .btn.sm { height: 40px; }
  .filters button, .seg button { min-height: 40px; }
  .input, .field :is(input, select, textarea), select.input { font-size: 16px; }
  th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; }
  th:first-child { background: var(--tile); }
  tbody tr:hover td:first-child { background: var(--lime); }
  .hero-art.cutout img { left: 0; right: 0; margin: 0 auto; height: 104%; }
  .cat-hit { right: 50%; transform: translateX(50%); width: 70%; }
  .big-date { left: 50%; top: 46%; transform: translate(-50%, -50%); font-size: 210px; }
  .intro .big-date { animation: none; }
  .big-month { left: 50%; bottom: 4%; transform: translateX(-50%); z-index: 1; color: #fff; background: rgba(0,0,0,.18); padding: 5px 12px; border-radius: 999px; }
  .disc { right: 50%; transform: translateX(50%); bottom: -18%; width: 82%; }
  .hero-copy { padding: 34px 22px 26px; }
  .display { font-size: 38px; }
  .av-stack .av, .av-stack .plus { width: 38px; height: 38px; font-size: 14px; }
  .hero-art { min-height: 240px; }
  .hero-art img { -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%); mask-image: linear-gradient(180deg, transparent 0%, #000 30%); }
  .page-head h1 { font-size: 32px; }
  .board { grid-template-columns: repeat(4, 84vw); scroll-snap-type: x mandatory; }
  .col { scroll-snap-align: start; }
  .cal { gap: 3px; padding: 8px; }
  .cal button.day { min-height: 56px; padding: 4px; border-radius: 10px; }
  .cal .dow { padding: 2px; text-align: center; font-size: 11px; }
  .cal .day .e, .cal .day .more { display: none; }
  .cal .day.has::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--violet); margin-left: 11px; }
  .spark { grid-template-columns: 1fr; padding: 24px; }
  .spark p { font-size: 22px; }
  .masonry { columns: 2 140px; column-gap: 10px; }
  .ref { margin-bottom: 10px; border-radius: 14px; }
  .ref figcaption { opacity: 1; transform: none; padding: 6px 10px; }
  .drawer .row2 { grid-template-columns: 1fr; }
  .post { grid-template-columns: 1fr; padding: 20px; }
  .post > .av { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>

function eventsOn(uid, d) {
  const k = key(d), dow = d.getDay(), out = [];
  if (dow >= 1 && dow <= 5) out.push({ start: '09:30', end: '09:45', title: 'Stand-up ประจำวัน', kind: 'team', where: 'มุมกลางสตูดิโอ' });
  if (dow === 1) out.push({ start: '10:30', end: '11:30', title: 'ประชุมวางแผนงานประจำสัปดาห์', kind: 'meeting', where: 'ห้องประชุมใหญ่' });

    for (let i = 0; i < n; i++) { const p = pick(r, POOL), s = slots[Math.floor(r() * slots.length)]; if (!out.some(e => e.start === s)) out.push({ start: s, end: '', title: p[0], kind: p[1], where: p[2] }); }
  }
  S.tasks.filter(t => t.assignee === uid && t.due === k && t.status !== 'done').forEach(t => out.push({ start: '18:00', end: '', title: `ครบกำหนด: ${t.title}`, kind: 'deadline', where: t.client }));
  S.events.filter(e => e.date === k && (e.who === uid || e.who === 'all')).forEach(e => out.push(e));

/* performance */
function perfOf(uid) {
  const r = rng('perf' + uid);
  const dowIdx = (TODAY.getDay() + 6) % 7; // Mon=0
  const prev = Array.from({ length: 7 }, (_, i) => i < 5 ? 1 + Math.floor(r() * 4) : Math.floor(r() * 2));
  const cur = Array.from({ length: 7 }, (_, i) => i < dowIdx ? 1 + Math.floor(r() * 4) : null);
  const doneToday = S.tasks.filter(t => t.assignee === uid && t.status === 'done' && t.doneAt === key(TODAY)).length;
  cur[dowIdx] = doneToday;
  const weekStart = addDays(TODAY, -dowIdx);
  const doneWeek = cur.reduce((a, b) => a + (b || 0), 0);
  const prevSame = prev.slice(0, dowIdx + 1).reduce((a, b) => a + b, 0);
  const active = S.tasks.filter(t => t.assignee === uid && t.status !== 'done').length;
  const late = S.tasks.filter(t => t.assignee === uid && t.status !== 'done' && diffDays(t.due) < 0).length;
  const onTime = Math.round(80 + r() * 18 - late * 4);
  return { prev, cur, dowIdx, doneWeek, prevSame, active, late, onTime, weekStart };
}

// Mascot poses: web-sized PNG cut-outs in assets/mascot/web/. Add a pose name here once its file exists.
const MASCOT_DIR = 'assets/mascot/web/';

/* Mascot video clips: green-screen MP4s in assets/mascot/video/<slot>.mp4, one per time of day.
   List a slot here once its file exists. crop = [x0, y0, x1, y1] of the frame to keep (drops empty green). */
// loopEnd = the time (s) whose frame best matches frame 0; the loop cuts there and crossfades into the start.
const MASCOT_VIDEOS = { morning: { crop: [0, .2, 1, .965], loopEnd: 5.64 } };

function catVideoName() {

  const slot = videoSlot(), names = Object.keys(MASCOT_VIDEOS);
  return MASCOT_VIDEOS[slot] ? slot : names[0] || null;
}
// Seamless loop: two copies of the clip take turns. Near loopEnd the next copy starts from 0 and the two
// are crossfaded, so a clip whose last frame doesn't match its first still loops without a jump.
const CAT_FADE = .4;
let catVids = null, catVidName = null, catVidIdx = 0;
function startCatVideo() {
  const canvas = document.querySelector('canvas.cat-video');
  if (!canvas) return;
  const name = canvas.dataset.video, cfg = MASCOT_VIDEOS[name], crop = cfg.crop;
  const art = canvas.closest('.hero-art');
  // The <video> pair survives re-renders so the clip doesn't restart or re-download.
  if (!catVids || catVidName !== name) {
    const make = () => Object.assign(document.createElement('video'), { src: `assets/mascot/video/${name}.mp4`, muted: true, playsInline: true, preload: 'auto' });
    catVids = [make(), make()]; catVidName = name; catVidIdx = 0;
    catVids[0].play().catch(() => {});
  }
  const gl = canvas.getContext('webgl', { premultipliedAlpha: true, alpha: true });
  if (!gl) { canvas.remove(); return; }
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p;uniform vec4 crop;varying vec2 uv;varying vec2 q;void main(){q=p*.5+.5;uv=vec2(mix(crop.x,crop.z,q.x),mix(crop.w,crop.y,q.y));gl_Position=vec4(p,0.,1.);}'));
  // Key out green (alpha from how much green exceeds red/blue), remove green spill, mix the two copies, soften the side edges.
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, 'precision mediump float;uniform sampler2D t0;uniform sampler2D t1;uniform float m;varying vec2 uv;varying vec2 q;vec4 key(vec4 c){float k=c.g-max(c.r,c.b);float a=1.-smoothstep(.06,.26,k);c.g=min(c.g,max(c.r,c.b)+.02);return vec4(c.rgb*a,a);}void main(){vec4 o=mix(key(texture2D(t0,uv)),key(texture2D(t1,uv)),m);o*=smoothstep(0.,.06,q.x)*smoothstep(1.,.94,q.x);gl_FragColor=o;}'));

  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t);
    [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(p => gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    return t;
  });
  const upload = (unit, vid) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, texs[unit]); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, vid); };

    if (!canvas.isConnected) { gl.getExtension('WEBGL_lose_context')?.loseContext(); return; }

        if (fading) upload(1, next);
        gl.uniform1f(uMix, m);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

function mascotPose(late, openCount) {
  const now = new Date(), m = now.getHours() * 60 + now.getMinutes();

  if (!el) return;
  const draw = () => {
    const w = el.offsetWidth, h = el.offsetHeight;
    const r = 24, k = 34;
    const cutW = Math.min(w * 0.17, 230), cutH = Math.min(h * 0.24, 120);
    const x1 = w - cutW, len = Math.hypot(cutW, cutH), dx = cutW / len, dy = cutH / len;
    const f = n => n.toFixed(1);
    el.style.setProperty('--hero-clip', `path('M 0 ${r} Q 0 0 ${r} 0 L ${f(x1 - k)} 0 Q ${f(x1)} 0 ${f(x1 + k * dx)} ${f(k * dy)} L ${f(w - k * dx)} ${f(cutH - k * dy)} Q ${w} ${f(cutH)} ${w} ${f(cutH + k)} L ${w} ${h - r} Q ${w} ${h} ${w - r} ${h} L ${r} ${h} Q 0 ${h} 0 ${h - r} Z')`);
  };
  draw();
  if (heroObserver) heroObserver.disconnect();
  heroObserver = new ResizeObserver(draw);
  heroObserver.observe(el);
}

/* Animated 3D-style weather art (inline SVG, no image assets) */
// Sky family for the weather tile and which parts the illustration needs.
function skyOf(wx) {
  const c = wx.code;
  const storm = c >= 95, rain = (c >= 51 && c <= 67) || (c >= 80 && c <= 82), fog = c >= 45 && c <= 48;
  const sun = c <= 2 && !fog;
  return { storm, rain, fog, sun, cloud: c >= 1, night: !wx.day, kind: storm ? 'storm' : rain ? 'rain' : !wx.day ? 'night' : c <= 1 ? 'clear' : 'cloud' };
}
// 3D icon PNGs live in assets/weather/<name>.png. List a name here once its file exists; the rest use the drawn art.
const WEATHER_DIR = 'assets/weather/';
const WEATHER_ICONS = [];
function iconName(wx) {
  const s = skyOf(wx);
  if (s.storm) return 'storm';
  if (s.rain) return 'rain';
  if (s.fog) return 'fog';
  if (wx.code <= 1) return wx.day ? 'sun' : 'moon';
  if (wx.code === 2) return wx.day ? 'cloud-sun' : 'cloud-moon';
  return 'cloud';
}
function weatherIcon(wx) {
  const name = iconName(wx);
  return WEATHER_ICONS.includes(name) ? `<img src="${WEATHER_DIR}${name}.png" alt="">` : weatherArt(wx);
}
let wxHourly = false;
const windFrom = deg => deg == null ? '' : 'จากทิศ' + ['เหนือ', 'ตะวันออกเฉียงเหนือ', 'ตะวันออก', 'ตะวันออกเฉียงใต้', 'ใต้', 'ตะวันตกเฉียงใต้', 'ตะวันตก', 'ตะวันตกเฉียงเหนือ'][Math.round(deg / 45) % 8];
function weatherArt(wx) {
  const s = skyOf(wx);
  const cloud = (cls, grad, tx, ty, sc) => `<g class="${cls}" transform="translate(${tx} ${ty}) scale(${sc})"><path filter="url(#wxSoft)" fill="url(#${grad})" d="M34 84h52a18 18 0 0 0 2-35.9A24 24 0 0 0 42 44a20 20 0 0 0-8 40z"/><ellipse cx="56" cy="55" rx="16" ry="6" fill="#fff" opacity=".85" filter="url(#wxBlur)"/><ellipse cx="38" cy="68" rx="7" ry="4" fill="#fff" opacity=".6" filter="url(#wxBlur)"/></g>`;
  const orb = s.night
    ? `<g class="wx-orb"><circle cx="78" cy="34" r="30" fill="#fff6c9" opacity=".22" class="wx-glow"/><circle cx="78" cy="34" r="20" fill="url(#wxMoon)"/><circle cx="71" cy="28" r="3.2" fill="#d8d2bd" opacity=".7"/><circle cx="84" cy="40" r="2.4" fill="#d8d2bd" opacity=".6"/></g>`
    : `<g class="wx-orb"><circle cx="76" cy="36" r="32" fill="#ffd34d" opacity=".28" class="wx-glow"/><circle cx="76" cy="36" r="22" fill="url(#wxSun)"/><ellipse cx="68" cy="27" rx="8" ry="5" fill="#fff" opacity=".75" filter="url(#wxBlur)"/></g>`;
  const drops = [38, 54, 70, 86].map((x, i) => `<path class="wx-drop" style="animation-delay:${[0, .45, .2, .65][i]}s" d="M${x} ${i % 2 ? 92 : 88}c-3.6 5.4-5.4 8.6-5.4 11.2a5.4 5.4 0 0 0 10.8 0c0-2.6-1.8-5.8-5.4-11.2z" fill="url(#wxDrop)"/>`).join('');
  const bolt = `<path class="wx-bolt" d="M62 80l-12 20h10l-5 16 16-22H60l6-14z" fill="url(#wxBolt)" stroke="#fff3b0" stroke-width="1"/>`;
  const fog = `<g class="wx-fog" stroke="#ffffff" stroke-linecap="round" stroke-width="5" opacity=".85"><path d="M26 96h46"/><path d="M40 106h52"/></g>`;
  const dark = s.storm || s.rain;
  return `<svg class="wx-art" viewBox="0 0 120 120" aria-hidden="true">
    <defs>

      <radialGradient id="wxMoon" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f1ecd8"/><stop offset="1" stop-color="#bdb59b"/></radialGradient>
      <radialGradient id="wxCloud" cx=".38" cy=".22" r=".9"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef3fc"/><stop offset="1" stop-color="#a9bbdc"/></radialGradient>
      <radialGradient id="wxCloudDark" cx=".38" cy=".22" r=".9"><stop offset="0" stop-color="#eef1f7"/><stop offset=".5" stop-color="#aeb9cf"/><stop offset="1" stop-color="#5d6c8c"/></radialGradient>
      <linearGradient id="wxDrop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#3f8cff"/></linearGradient>
      <linearGradient id="wxBolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6a8"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
      <filter id="wxSoft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1c2b55" flood-opacity=".28"/></filter>
      <filter id="wxBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
    </defs>
    ${s.sun || s.night ? orb : ''}
    ${s.storm ? bolt : ''}
    ${s.rain || s.storm ? drops : ''}
    ${s.cloud && !s.sun && !s.night ? cloud('wx-cloud back', dark ? 'wxCloudDark' : 'wxCloud', 38, -18, .62) : ''}
    ${s.cloud ? cloud('wx-cloud', dark ? 'wxCloudDark' : 'wxCloud', s.sun || s.night ? -6 : 0, s.sun || s.night ? 4 : -6, 1) : ''}
    ${s.fog ? fog : ''}
  </svg>`;
}

  'Hikari Ramen': ['#c23b22', '#fff4e6'], 'KM Fitness': ['#1d2b3a', '#d9f15c'], 'กรีนโฮม': ['#dfe7d3', '#2c4a2a'],
  'สยามมอเตอร์': ['#1f3a5f', '#eef2f6'], 'บ้านขนมไทย': ['#f2d9a6', '#7a3e12'],
};
const RATIO = { social: '4 / 5', banner: '16 / 7', kv: '4 / 5', pack: '1 / 1', motion: '16 / 9', print: '3 / 4' };
function art(t) {
  const ratio = RATIO[t.type] || '4 / 5';
  if (t.img) return `<div style="aspect-ratio:${ratio}"><img src="${esc(t.img)}" alt="ดราฟต์: ${esc(t.title)}" loading="lazy"></div>`;
  if (t.status === 'todo') return `<div class="art empty" style="aspect-ratio:5 / 2"><i data-lucide="image-plus"></i><p>${t.note ? esc(t.note.slice(0, 60)) : 'ยังไม่มีดราฟต์ แนบลิงก์ภาพได้ในรายละเอียดงาน'}</p></div>`;
  const r = rng(t.id), [bg, fg] = BRANDS[t.client] || [`hsl(${Math.floor(r() * 360)} 30% 82%)`, '#1c1b18'];
  const tp = TYPES.find(x => x.id === t.type) || TYPES[5];
  const head = t.title.split(' ').slice(0, 3).join(' ');
  return `<div class="art v${Math.floor(r() * 3)} t-${t.type}" style="--bg:${bg};--fg:${fg};aspect-ratio:${ratio}">
    <i class="s"></i><span class="k">${esc(tp.label)}</span><b>${esc(head)}</b><small>${esc(t.client)}</small>
    ${t.type === 'motion' ? '<span class="play"><span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></span>' : ''}
  </div>`;
}
function card(t, showWho) {
  const done = t.status === 'done', d = done ? { t: 'ส่งแล้ว', cls: '' } : dueText(t.due);
  const idx = STATUSES.findIndex(s => s.id === t.status), next = STATUSES[idx + 1];
  const ver = t.status === 'todo' ? '' : `<span class="ver">v${1 + (rng(t.id + 'v')() * 3 | 0)}</span>`;
  return `<article class="card${t.id === justDone ? ' just-done' : ''}" draggable="true" data-card="${t.id}" style="view-transition-name:c-${t.id}" tabindex="0" aria-label="${esc(t.title)}, ${esc(t.client)}, ${d.t}">
    <div class="frame">${art(t)}${done ? '<span class="stamp"><svg aria-hidden="true"><use href="#paw"/></svg>เรียบร้อย</span>' : ''}<span class="badges">${t.urgent && !done ? '<span class="urgent">ด่วน</span>' : ''}${ver}</span></div>
    <div class="cap">
      <span class="client"><span>${esc(t.client)}</span>${showWho ? av(t.assignee) : ''}</span>
      <span class="title">${esc(t.title)}</span>
      <div class="card-foot"><span class="due ${d.cls}"><i data-lucide="${done ? 'check' : 'clock'}"></i>${d.t}</span>
        ${next ? `<button class="move" data-move="${t.id}" aria-label="ย้าย ${esc(t.title)} ไปที่ ${next.label}">ถัดไป<i data-lucide="arrow-right"></i></button>` : ''}</div>
    </div>
  </article>`;
}

function renderCalendar() {
  const u = me();
  const sel = S.calSel || key(TODAY);
  const first = new Date(calMonth), start = addDays(first, -((first.getDay() + 6) % 7));
  const cells = [];
  for (let i = 0; i < 42; i++) cells.push(addDays(start, i));
  const trimmed = cells[35].getMonth() !== calMonth.getMonth() ? cells.slice(0, 35) : cells;
  const selD = parse(sel), selEvs = eventsOn(u.id, selD);
  return `<div class="page">
    <div class="page-head"><div><h1>ปฏิทินของ${mark(esc(u.name))}${doodle('squiggle')}</h1><p>นัดหมายส่วนตัว นัดทีม และวันครบกำหนดงานรวมอยู่ที่เดียว</p></div>
      <div class="cal-nav"><button class="icon-btn" data-m="-1" aria-label="เดือนก่อน"><i data-lucide="chevron-left"></i></button>
      <h2>${thDate(calMonth, { month: 'long', year: 'numeric' })}</h2>
      <button class="icon-btn" data-m="1" aria-label="เดือนถัดไป"><i data-lucide="chevron-right"></i></button>
      <button class="btn sm" data-m="0">วันนี้</button></div>
    </div>
    <div class="cal-wrap">
      <div class="cal">
        ${['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสฯ', 'ศุกร์', 'เสาร์', 'อาทิตย์'].map(d => `<div class="dow">${d}</div>`).join('')}
        ${trimmed.map(d => {
          const evs = eventsOn(u.id, d).filter(e => e.kind !== 'team');
          const k = key(d);
          return `<button class="day ${d.getMonth() !== calMonth.getMonth() ? 'out' : ''} ${k === key(TODAY) ? 'today' : ''} ${evs.length ? 'has' : ''}" data-day="${k}" aria-pressed="${k === sel}" aria-label="${thDate(d, { day: 'numeric', month: 'long' })} ${evs.length} นัด">
            <span class="d">${d.getDate()}</span>
            ${evs.slice(0, 2).map(e => `<span class="e ${e.kind}">${e.start} ${esc(e.title)}</span>`).join('')}
            ${evs.length > 2 ? `<span class="more">+${evs.length - 2} รายการ</span>` : ''}
          </button>`;
        }).join('')}
      </div>
      <aside class="agenda">
        <h2>${thDate(selD, { weekday: 'long', day: 'numeric', month: 'long' })}</h2>
        ${selEvs.length ? `<ul class="timeline">${selEvs.map(e => `<li><time>${e.start}</time><div class="ev ${e.kind}"><div>${esc(e.title)}</div><small><i data-lucide="map-pin"></i>${esc(e.where || '')}</small></div></li>`).join('')}</ul>` : `<p class="empty">ไม่มีนัดในวันนี้ เพิ่มนัดใหม่ได้ด้านล่าง</p>`}
        <form class="add-ev" id="evForm">
          <h3>เพิ่มนัดหมาย</h3>
          <div class="row"><input class="input" type="time" name="start" required value="10:00" aria-label="เวลา"><input class="input" name="title" required placeholder="หัวข้อนัด" aria-label="หัวข้อนัด"></div>
          <input class="input" name="where" placeholder="สถานที่ หรือ ลิงก์ประชุม" aria-label="สถานที่">
          <select class="input" name="who" aria-label="นัดสำหรับ"><option value="me">เฉพาะฉัน</option><option value="all">ทั้งทีม</option></select>
          <button class="btn primary" type="submit"><i data-lucide="plus"></i>เพิ่มลงปฏิทิน</button>
        </form>

}

  const sorters = { name: (a, b) => a.m.name.localeCompare(b.m.name, 'th'), active: (a, b) => b.p.active - a.p.active, done: (a, b) => b.p.doneWeek - a.p.doneWeek, ontime: (a, b) => b.p.onTime - a.p.onTime, late: (a, b) => b.p.late - a.p.late };
  rows.sort(sorters[S.teamSort] || sorters.active);
  const th = (k, label, r) => `<th class="${r ? 'r' : ''}" aria-sort="${S.teamSort === k ? 'descending' : 'none'}"><button data-sort="${k}">${label}${S.teamSort === k ? '<i data-lucide="arrow-down"></i>' : ''}</button></th>`;
  const totalActive = rows.reduce((a, r) => a + r.p.active, 0), totalLate = rows.reduce((a, r) => a + r.p.late, 0);

    <div class="page-head"><div><h1>ภาพรวม${mark('ทีม')}${doodle('squiggle')}</h1><p>${MEMBERS.length} คน · งานค้างรวม ${totalActive} ชิ้น${totalLate ? ` · เลยกำหนด ${totalLate} ชิ้น` : ''} คลิกที่ชื่อเพื่อเปิดหน้าเลขาของคนนั้น</p></div></div>
    <div class="table-wrap"><table>
      <thead><tr>${th('name', 'สมาชิก')}${th('active', 'งานที่ถือ', 1)}${th('late', 'เลยกำหนด', 1)}${th('done', 'ปิดงานสัปดาห์นี้', 1)}${th('ontime', 'ส่งตรงเวลา', 1)}</tr></thead>
      <tbody>${rows.map(({ m, p }) => `<tr>
        <td><a class="person" href="#desk" data-as="${m.id}" style="color:inherit;text-decoration:none">${av(m.id)}<span>${esc(m.name)} <span class="muted">· ${esc(m.full)}</span><small>${esc(m.role)}</small></span></a></td>
        <td class="r">${p.active}</td>
